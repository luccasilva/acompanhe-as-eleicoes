name: Apuração ao vivo

# Roda o poller e o leitor de boletins do exterior durante a apuração, gravando no Redis que
# o site (Vercel) lê. Cada execução dura até ~5h30; o agendamento a cada 10 minutos deixa a
# próxima na fila, e ela retoma do estado salvo no Redis quando a anterior termina.
# Uma execução que começa antes das 16h30 termina às 16h40, para que a troca de máquina
# aconteça antes das 17h e a seguinte cubra a apuração inteira (16h40 → ~22h10).
on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

concurrency:
  group: apuracao
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apuracao:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TZ: America/Sao_Paulo
      REDIS_URL: ${{ secrets.REDIS_URL }}
      FIM_DA_APURACAO: "202610261200" # depois disso as execuções agendadas saem na hora
      TROCA_ANTES_DA_APURACAO: "16:40"
    steps:
      - name: Ainda é dia de apuração?
        id: janela
        run: |
          if [ "$(date +%Y%m%d%H%M)" -gt "$FIM_DA_APURACAO" ]; then
            echo "Apuração encerrada; nada a fazer."
            echo "encerrada=1" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.janela.outputs.encerrada != '1'

      - uses: actions/setup-python@v5
        if: steps.janela.outputs.encerrada != '1'
        with:
          python-version: "3.12"

      - name: Dependências
        if: steps.janela.outputs.encerrada != '1'
        run: pip install numpy

      - name: Poller e boletins do exterior
        if: steps.janela.outputs.encerrada != '1'
        run: |
          test -n "$REDIS_URL" || { echo "Falta o segredo REDIS_URL no repositório"; exit 1; }
          agora=$(date +%s)
          troca=$(date -d "today $TROCA_ANTES_DA_APURACAO" +%s)
          if [ "$agora" -lt $((troca - 600)) ]; then
            duracao=$(( (troca - agora) / 60 ))
          else
            duracao=330
          fi
          echo "Esta execução roda $duracao minutos (até $(date -d "@$((agora + duracao * 60))" +%H:%M))"
          python3 -u exterior_bu.py --duracao-min "$duracao" &
          python3 -u poller.py --duracao-min "$duracao" &
          wait
